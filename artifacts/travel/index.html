<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Next Level</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
    background: #0a0806;
    font-family: 'Georgia', serif;
  }
  body { overflow-y: auto; }
  html { overflow-y: visible; }

  /* ---- LOADER ---- */
  #loader {
    position: fixed; inset: 0;
    background: #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.25rem;
    z-index: 1000;
    transition: opacity 0.6s ease;
    color: #f5edd8;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .label {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(245,237,216,0.7);
  }
  #loader-bar {
    width: min(320px, 60vw);
    height: 2px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  #loader-bar > span {
    display: block;
    width: 0%;
    height: 100%;
    background: #f5edd8;
    transition: width 0.15s linear;
  }
  #loader .pct {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: rgba(245,237,216,0.5);
  }

  /* ---- HERO ---- */
  #hero {
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0a0806;
    color: #f5edd8;
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  /* ---- CANVAS SECTION ---- */
  #canvas-wrapper {
    position: relative;
    width: 100%;
    /* JS sets actual scroll distance via ScrollTrigger end; height here is a placeholder */
  }
  #sticky-container {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #0a0806;
  }
  #frame-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px; width: 0%;
    background: rgba(255,255,255,0.7);
    z-index: 10;
  }

  #scroll-hint {
    position: absolute;
    bottom: 2.5rem; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    display: flex; flex-direction: column;
    align-items: center; gap: 0.6rem;
    z-index: 10;
  }
  #scroll-hint .line {
    width: 1px; height: 40px;
    background: rgba(255,255,255,0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scaleY(0.8); }
    50%     { opacity: 1;   transform: scaleY(1.2); }
  }

  #video-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 5rem;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
  }
  #video-overlay h2 {
    font-size: clamp(2rem, 5vw, 4.5rem);
    color: #fff;
    letter-spacing: 0.1em;
    text-align: center;
    font-weight: 400;
    text-shadow: 0 2px 30px rgba(0,0,0,0.4);
    line-height: 1.2;
  }

  /* ---- NEXT SECTION ---- */
  #next-section {
    min-height: 100vh;
    background: #dce8f0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.5rem;
    color: #1a2744;
    text-align: center;
    padding: 4rem 2rem;
    opacity: 0;
    transform: translateY(40px);
  }
  #next-section .label {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #6a8fa8;
  }
  #next-section h2 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 400;
    line-height: 1.1;
  }
  #next-section p {
    font-size: 1.05rem;
    color: #4a6070;
    max-width: 480px;
    line-height: 1.8;
  }
  #next-section .cta {
    margin-top: 0.5rem;
    padding: 0.9rem 2.5rem;
    background: #1a2744;
    color: #dce8f0;
    border: none;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, letter-spacing 0.3s;
  }
  #next-section .cta:hover {
    background: #2a3d6a;
    letter-spacing: 0.35em;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="label">Loading Frames</div>
  <div id="loader-bar"><span></span></div>
  <div class="pct">0%</div>
</div>

<section id="hero">
  <span>Travel Next Level</span>
</section>

<div id="canvas-wrapper">
  <div id="sticky-container">
    <canvas id="frame-canvas"></canvas>

    <div id="progress-bar"></div>

    <div id="video-overlay">
      <h2>Step Into a World<br>of Discoveries</h2>
    </div>

    <div id="scroll-hint">
      <span>Scroll</span>
      <div class="line"></div>
    </div>
  </div>
</div>

<section id="next-section">
  <p class="label">Explore Destinations</p>
  <h2>Where will you<br>go next?</h2>
  <p>Unique travel destinations await to spark curiosity and inspire your next adventure.</p>
  <button class="cta">Explore Now</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<script>
  /* ---------- CONFIG ---------- */
  const frameCount = 123;
  const currentFrame = (index) =>
    `/frames/ezgif-frame-${(index + 1).toString().padStart(3, "0")}.jpg`;

  /* ---------- ELEMENTS ---------- */
  const canvas       = document.getElementById('frame-canvas');
  const ctx          = canvas.getContext('2d');
  const wrapper      = document.getElementById('canvas-wrapper');
  const sticky       = document.getElementById('sticky-container');
  const progressBar  = document.getElementById('progress-bar');
  const scrollHint   = document.getElementById('scroll-hint');
  const videoOverlay = document.getElementById('video-overlay');
  const nextSection  = document.getElementById('next-section');
  const loader       = document.getElementById('loader');
  const loaderFill   = document.querySelector('#loader-bar > span');
  const loaderPct    = document.querySelector('#loader .pct');

  /* ---------- CANVAS SIZING (object-fit: cover) ---------- */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    const w = sticky.clientWidth;
    const h = sticky.clientHeight;
    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
  }

  function drawCover(img) {
    if (!img || !img.complete || !img.naturalWidth) return;
    const cw = canvas.width;
    const ch = canvas.height;
    const ir = img.naturalWidth / img.naturalHeight;
    const cr = cw / ch;
    let dw, dh, dx, dy;
    if (ir > cr) {
      // image is wider — fit height, crop sides
      dh = ch;
      dw = ch * ir;
      dx = (cw - dw) / 2;
      dy = 0;
    } else {
      dw = cw;
      dh = cw / ir;
      dx = 0;
      dy = (ch - dh) / 2;
    }
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  /* ---------- PRELOAD FRAMES ---------- */
  const images = new Array(frameCount);
  let loaded = 0;

  function setLoaderProgress(p) {
    const pct = Math.round(p * 100);
    loaderFill.style.width = pct + '%';
    loaderPct.textContent = pct + '%';
  }

  function preloadAll() {
    return new Promise((resolve) => {
      for (let i = 0; i < frameCount; i++) {
        const img = new Image();
        img.onload = img.onerror = () => {
          loaded++;
          setLoaderProgress(loaded / frameCount);
          if (loaded === frameCount) resolve();
        };
        img.src = currentFrame(i);
        images[i] = img;
      }
    });
  }

  /* ---------- SCROLL SETUP ---------- */
  const state = { frame: 0 };

  function render() {
    const idx = Math.max(0, Math.min(frameCount - 1, Math.round(state.frame)));
    drawCover(images[idx]);
  }

  function initScroll() {
    /* Lenis smooth scroll */
    const lenis = new Lenis({
      duration: 1.1,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      smoothTouch: false,
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    /* Frame scrub */
    gsap.to(state, {
      frame: frameCount - 1,
      ease: 'none',
      scrollTrigger: {
        trigger: wrapper,
        start: 'top top',
        end: () => '+=' + (window.innerHeight * 7),
        scrub: 0.5,
        pin: sticky,
        anticipatePin: 1,
        onUpdate: (self) => {
          const p = self.progress;
          progressBar.style.width = (p * 100) + '%';

          if (p > 0.03) {
            gsap.to(scrollHint, { opacity: 0, duration: 0.4, overwrite: true });
          } else {
            gsap.to(scrollHint, { opacity: 1, duration: 0.4, overwrite: true });
          }

          if (p > 0.20) {
            gsap.to(videoOverlay, {
              opacity: Math.min((p - 0.20) * 2, 0.95),
              duration: 0.3, overwrite: true
            });
          } else {
            gsap.to(videoOverlay, { opacity: 0, duration: 0.3, overwrite: true });
          }

          if (p >= 0.95) {
            gsap.to(nextSection, {
              opacity: 1, y: 0, duration: 0.9,
              ease: 'power2.out', overwrite: true
            });
          } else {
            gsap.to(nextSection, {
              opacity: 0, y: 40, duration: 0.4, overwrite: true
            });
          }
        },
      },
      onUpdate: render,
    });

    /* Resize handling */
    window.addEventListener('resize', () => {
      resizeCanvas();
      render();
      ScrollTrigger.refresh();
    });
  }

  /* ---------- BOOT ---------- */
  resizeCanvas();
  preloadAll().then(() => {
    render();
    initScroll();
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 800);
  });
</script>
</body>
</html>
