<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Next Level</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body { background: #000; font-family: 'Georgia', serif; overflow-x: hidden; }

  #hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0806;
    color: #f5edd8;
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  #scroll-video-wrapper {
    position: relative;
    height: 500vh;
  }

  #sticky-container {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  #scroll-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: rgba(255,255,255,0.7);
    z-index: 10;
    transform-origin: left;
  }

  #scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    z-index: 10;
  }

  #scroll-hint .line {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scaleY(0.8); }
    50% { opacity: 1; transform: scaleY(1.2); }
  }

  #video-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 5rem;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
  }

  #video-overlay h2 {
    font-size: clamp(2rem, 5vw, 4.5rem);
    color: #fff;
    letter-spacing: 0.1em;
    text-align: center;
    font-weight: 400;
    text-shadow: 0 2px 30px rgba(0,0,0,0.4);
    line-height: 1.2;
  }

  #next-section {
    min-height: 100vh;
    background: #dce8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    color: #1a2744;
    text-align: center;
    padding: 4rem 2rem;
    opacity: 0;
    transform: translateY(40px);
  }

  #next-section .label {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #6a8fa8;
  }

  #next-section h2 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 400;
    line-height: 1.1;
  }

  #next-section p {
    font-size: 1.05rem;
    color: #4a6070;
    max-width: 480px;
    line-height: 1.8;
  }

  #next-section .cta {
    margin-top: 0.5rem;
    padding: 0.9rem 2.5rem;
    background: #1a2744;
    color: #dce8f0;
    border: none;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, letter-spacing 0.3s;
  }

  #next-section .cta:hover {
    background: #2a3d6a;
    letter-spacing: 0.35em;
  }
</style>
</head>
<body>

<section id="hero">
  <span>Travel Next Level</span>
</section>

<div id="scroll-video-wrapper">
  <div id="sticky-container">
    <video
      id="scroll-video"
      src="door-video.mp4"
      muted
      playsinline
      preload="auto"
    ></video>

    <div id="progress-bar"></div>

    <div id="video-overlay">
      <h2>Step Into a World<br>of Discoveries</h2>
    </div>

    <div id="scroll-hint">
      <span>Scroll</span>
      <div class="line"></div>
    </div>
  </div>
</div>

<section id="next-section">
  <p class="label">Explore Destinations</p>
  <h2>Where will you<br>go next?</h2>
  <p>Unique travel destinations await to spark curiosity and inspire your next adventure.</p>
  <button class="cta">Explore Now</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  const video = document.getElementById('scroll-video');
  const progressBar = document.getElementById('progress-bar');
  const scrollHint = document.getElementById('scroll-hint');
  const videoOverlay = document.getElementById('video-overlay');
  const nextSection = document.getElementById('next-section');

  let duration = 0;

  function initScrollVideo() {
    duration = video.duration;
    if (!duration || isNaN(duration)) return;

    video.pause();
    video.currentTime = 0;

    const proxy = { time: 0 };

    ScrollTrigger.create({
      trigger: '#scroll-video-wrapper',
      start: 'top top',
      end: 'bottom bottom',
      scrub: 1,
      onUpdate: (self) => {
        const p = self.progress;

        gsap.to(proxy, {
          time: p * duration,
          duration: 0.3,
          ease: 'none',
          overwrite: true,
          onUpdate: () => {
            video.currentTime = proxy.time;
          }
        });

        progressBar.style.width = (p * 100) + '%';

        if (p > 0.03) {
          gsap.to(scrollHint, { opacity: 0, duration: 0.4 });
        } else {
          gsap.to(scrollHint, { opacity: 1, duration: 0.4 });
        }

        if (p > 0.12) {
          gsap.to(videoOverlay, { opacity: Math.min((p - 0.12) * 2.5, 0.95), duration: 0.3 });
        } else {
          gsap.to(videoOverlay, { opacity: 0, duration: 0.3 });
        }
      }
    });

    gsap.to(nextSection, {
      opacity: 1,
      y: 0,
      duration: 1,
      ease: 'power2.out',
      scrollTrigger: {
        trigger: '#next-section',
        start: 'top 85%',
        toggleActions: 'play none none reverse'
      }
    });
  }

  if (video.readyState >= 1) {
    initScrollVideo();
  } else {
    video.addEventListener('loadedmetadata', initScrollVideo);
  }
</script>
</body>
</html>
