<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Video Section</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: #000;
    font-family: 'Georgia', serif;
    overflow-x: hidden;
  }

  /* ---- SECTION 1: Hero trước video ---- */
  #hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0806;
    color: #f5edd8;
    font-size: 2rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ---- SCROLL VIDEO SECTION ---- */
  #scroll-video-wrapper {
    position: relative;
    /* height = bao nhiêu scroll để chạy hết video
       5s video @ 60fps = 300 frames
       mỗi px scroll = ~1ms video → 5000px cho 5s video
       bro có thể tăng/giảm con số này */
    height: 500vh;
  }

  #sticky-container {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  #scroll-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Progress bar */
  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: rgba(255,255,255,0.8);
    transition: width 0.05s linear;
    z-index: 10;
  }

  /* Scroll hint */
  #scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    z-index: 10;
    transition: opacity 0.5s;
  }

  #scroll-hint .line {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.4);
    animation: scrollPulse 1.5s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); opacity: 0.4; }
    50% { transform: scaleY(1.3); opacity: 1; }
  }

  /* Overlay text khi video đang chạy */
  #video-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 6rem;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.5s;
  }

  #video-overlay h2 {
    font-size: clamp(2rem, 5vw, 4rem);
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    text-align: center;
    font-weight: 400;
  }

  /* ---- SECTION TIẾP THEO ---- */
  #next-section {
    min-height: 100vh;
    background: #e8f0f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    color: #1a2744;
    text-align: center;
    padding: 4rem 2rem;
  }

  #next-section .label {
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #6a8fa8;
  }

  #next-section h2 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  #next-section p {
    font-size: 1.1rem;
    color: #4a6070;
    max-width: 500px;
    line-height: 1.8;
  }

  #next-section .cta {
    margin-top: 1rem;
    padding: 0.9rem 2.5rem;
    background: #1a2744;
    color: #e8f0f5;
    border: none;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s;
  }

  #next-section .cta:hover { background: #2a3d6a; }

  /* Fade in next section khi video xong */
  #next-section {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  #next-section.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<!-- SECTION 1 -->
<section id="hero">
  <span>Travel Next Level</span>
</section>

<!-- SCROLL VIDEO SECTION -->
<div id="scroll-video-wrapper">
  <div id="sticky-container">

    <!--
      ĐỔI src="your-video.mp4" thành đường dẫn video của bro
      Ví dụ trên Replit: src="./door-video.mp4"
    -->
    <video
      id="scroll-video"
      src="your-video.mp4"
      muted
      playsinline
      preload="auto"
    ></video>

    <div id="progress-bar"></div>

    <div id="video-overlay">
      <h2>Step Into a World<br>of Discoveries</h2>
    </div>

    <div id="scroll-hint">
      <span>Scroll</span>
      <div class="line"></div>
    </div>

  </div>
</div>

<!-- SECTION TIẾP THEO -->
<section id="next-section">
  <p class="label">Explore Destinations</p>
  <h2>Where will you<br>go next?</h2>
  <p>Unique travel destinations await to spark curiosity and inspire your next adventure.</p>
  <button class="cta">Explore Now</button>
</section>


<script>
  const wrapper = document.getElementById('scroll-video-wrapper');
  const video = document.getElementById('scroll-video');
  const progressBar = document.getElementById('progress-bar');
  const scrollHint = document.getElementById('scroll-hint');
  const videoOverlay = document.getElementById('video-overlay');
  const nextSection = document.getElementById('next-section');

  let videoDuration = 0;
  let ticking = false;
  let videoEnded = false;

  video.addEventListener('loadedmetadata', () => {
    videoDuration = video.duration;
    video.currentTime = 0;
    video.pause();
  });

  function updateVideo() {
    const wrapperRect = wrapper.getBoundingClientRect();
    const wrapperHeight = wrapper.offsetHeight;
    const viewportHeight = window.innerHeight;

    const scrolled = -wrapperRect.top;
    const scrollable = wrapperHeight - viewportHeight;

    if (scrolled < 0) {
      video.currentTime = 0;
      progressBar.style.width = '0%';
      scrollHint.style.opacity = '1';
      videoOverlay.style.opacity = '0';
      videoEnded = false;
      return;
    }

    if (scrolled > scrollable) {
      video.currentTime = videoDuration;
      progressBar.style.width = '100%';

      if (!videoEnded) {
        videoEnded = true;
        nextSection.classList.add('visible');
      }
      return;
    }

    const progress = scrolled / scrollable;
    const targetTime = progress * videoDuration;

    video.currentTime = targetTime;
    progressBar.style.width = (progress * 100) + '%';

    if (progress > 0.05) {
      scrollHint.style.opacity = '0';
      videoOverlay.style.opacity = progress > 0.1 ? Math.min((progress - 0.1) * 3, 0.9) : '0';
    } else {
      scrollHint.style.opacity = '1';
      videoOverlay.style.opacity = '0';
    }

    if (progress < 0.98) {
      videoEnded = false;
    }

    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(updateVideo);
      ticking = true;
    }
  }, { passive: true });

  updateVideo();
</script>

</body>
</html>
